kind = "slides"
previewPath = "/abcde-lv-deck/"
title = "ABCDE.lv – Slide Deck"
version = "1.0.0"
id = "artifacts/abcde-lv-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/abcde-lv-deck/" ]
localPort = 19477

[services.development]
run = "pnpm --filter @workspace/abcde-lv-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abcde-lv-deck", "run", "build" ]
publicDir = "artifacts/abcde-lv-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19477"
BASE_PATH = "/abcde-lv-deck/"
