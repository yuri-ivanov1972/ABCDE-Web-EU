kind = "web"
previewPath = "/"
title = "ABCDE.lv"
version = "1.0.0"
id = "artifacts/abcde-lv"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20716

[services.development]
run = "pnpm --filter @workspace/abcde-lv run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abcde-lv", "run", "build" ]
publicDir = "artifacts/abcde-lv/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20716"
BASE_PATH = "/"
