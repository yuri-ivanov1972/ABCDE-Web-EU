<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">

  <!-- Background Color Definitions (Approximate Nutri-Score) -->
  <defs>
    <color id="nutriA">#21823D</color> <!-- Dark Green -->
    <color id="nutriB">#8DB400</color> <!-- Light Green -->
    <color id="nutriC">#FFCC00</color> <!-- Yellow -->
    <color id="nutriD">#F58220</color> <!-- Orange -->
    <color id="nutriE">#EE3124</color> <!-- Red -->
  </defs>

  <!-- Background Rectangles -->
  <rect x="0"   y="0" width="64" height="80" fill="#21823D" /> <!-- A Background -->
  <rect x="64"  y="0" width="64" height="80" fill="#8DB400" /> <!-- B Background -->
  <rect x="128" y="0" width="64" height="80" fill="#FFCC00" /> <!-- C Background -->
  <rect x="192" y="0" width="64" height="80" fill="#F58220" /> <!-- D Background -->
  <rect x="256" y="0" width="64" height="80" fill="#EE3124" /> <!-- E Background -->

  <!-- Text Letters -->
  <text x="32"  y="45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="96"  y="45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B</text>
  <text x="160" y="45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">C</text>
  <text x="224" y="45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">D</text>
  <text x="288" y="45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">E</text>

</svg>