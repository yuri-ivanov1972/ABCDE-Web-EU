<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">

  <!-- Background Color Definitions (Exact Nutri-Score colors from the app) -->
  <defs>
    <color id="nutriA">#1e8e3e</color> <!-- Dark Green -->
    <color id="nutriB">#74b816</color> <!-- Light Green -->
    <color id="nutriC">#fcc200</color> <!-- Yellow -->
    <color id="nutriD">#ff8800</color> <!-- Orange -->
    <color id="nutriE">#e12d39</color> <!-- Red -->
  </defs>

  <!-- Background Rectangles -->
  <rect x="0"   y="0" width="64" height="80" fill="#1e8e3e" /> <!-- A Background -->
  <rect x="64"  y="0" width="64" height="80" fill="#74b816" /> <!-- B Background -->
  <rect x="128" y="0" width="64" height="80" fill="#fcc200" /> <!-- C Background -->
  <rect x="192" y="0" width="64" height="80" fill="#ff8800" /> <!-- D Background -->
  <rect x="256" y="0" width="64" height="80" fill="#e12d39" /> <!-- E Background -->

  <!-- Text Letters -->
  <text x="32"  y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="96"  y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">B</text>
  <text x="160" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">C</text>
  <text x="224" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">D</text>
  <text x="288" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">E</text>

</svg>